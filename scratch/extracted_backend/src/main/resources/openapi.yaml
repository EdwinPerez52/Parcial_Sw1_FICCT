openapi: 3.0.3
info:
  title: "prueba API"
  description: "Backend Spring Boot generado desde Collab Modeler (revisión 186)"
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Servidor local
security:
  - BearerAuth: []
paths:
  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registro de usuario (primer usuario obtiene ADMIN)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
      responses:
        '200':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicio de sesión con correo y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/refresh:
    post:
      tags: [Autenticación]
      summary: Refrescar token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: Token refrescado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Token de refresco inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Obtener perfil del usuario autenticado
      responses:
        '200':
          description: Perfil actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/usuario:
    get:
      tags: ["Usuario"]
      summary: "Listar Usuario"
      responses:
        '200':
          description: "Lista de Usuario"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioOutputDto'
    post:
      tags: ["Usuario"]
      summary: "Crear Usuario"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInputDto'
      responses:
        '201':
          description: "Usuario creado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutputDto'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/usuario/{id}:
    get:
      tags: ["Usuario"]
      summary: "Obtener Usuario por ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          format: int32
      responses:
        '200':
          description: "Usuario encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutputDto'
        '404':
          description: "No encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Usuario"]
      summary: "Actualizar Usuario"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInputDto'
      responses:
        '200':
          description: "Usuario actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutputDto'
        '400':
          description: Datos inválidos
        '404':
          description: No encontrado
    delete:
      tags: ["Usuario"]
      summary: "Eliminar Usuario"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          format: int32
      responses:
        '204':
          description: "Eliminado exitosamente"
        '404':
          description: No encontrado
  /api/doctor:
    get:
      tags: ["Doctor"]
      summary: "Listar Doctor"
      responses:
        '200':
          description: "Lista de Doctor"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorOutputDto'
    post:
      tags: ["Doctor"]
      summary: "Crear Doctor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorInputDto'
      responses:
        '201':
          description: "Doctor creado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOutputDto'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/doctor/{id}:
    get:
      tags: ["Doctor"]
      summary: "Obtener Doctor por ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: "Doctor encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOutputDto'
        '404':
          description: "No encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Doctor"]
      summary: "Actualizar Doctor"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorInputDto'
      responses:
        '200':
          description: "Doctor actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorOutputDto'
        '400':
          description: Datos inválidos
        '404':
          description: No encontrado
    delete:
      tags: ["Doctor"]
      summary: "Eliminar Doctor"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '204':
          description: "Eliminado exitosamente"
        '404':
          description: No encontrado
  /api/prubea:
    get:
      tags: ["Prubea"]
      summary: "Listar Prubea"
      responses:
        '200':
          description: "Lista de Prubea"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrubeaOutputDto'
    post:
      tags: ["Prubea"]
      summary: "Crear Prubea"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrubeaInputDto'
      responses:
        '201':
          description: "Prubea creado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrubeaOutputDto'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/prubea/{id}:
    get:
      tags: ["Prubea"]
      summary: "Obtener Prubea por ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: "Prubea encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrubeaOutputDto'
        '404':
          description: "No encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Prubea"]
      summary: "Actualizar Prubea"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrubeaInputDto'
      responses:
        '200':
          description: "Prubea actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrubeaOutputDto'
        '400':
          description: Datos inválidos
        '404':
          description: No encontrado
    delete:
      tags: ["Prubea"]
      summary: "Eliminar Prubea"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '204':
          description: "Eliminado exitosamente"
        '404':
          description: No encontrado
  /api/producto:
    get:
      tags: ["Producto"]
      summary: "Listar Producto"
      responses:
        '200':
          description: "Lista de Producto"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductoOutputDto'
    post:
      tags: ["Producto"]
      summary: "Crear Producto"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInputDto'
      responses:
        '201':
          description: "Producto creado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOutputDto'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/producto/{id}:
    get:
      tags: ["Producto"]
      summary: "Obtener Producto por ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '200':
          description: "Producto encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOutputDto'
        '404':
          description: "No encontrado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: ["Producto"]
      summary: "Actualizar Producto"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInputDto'
      responses:
        '200':
          description: "Producto actualizado"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductoOutputDto'
        '400':
          description: Datos inválidos
        '404':
          description: No encontrado
    delete:
      tags: ["Producto"]
      summary: "Eliminar Producto"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          format: uuid
      responses:
        '204':
          description: "Eliminado exitosamente"
        '404':
          description: No encontrado
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6
        fullName:
          type: string
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [ROLE_ADMIN, ROLE_USER]
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/AuthUserResponse'
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        validationErrors:
          type: object
          additionalProperties:
            type: string
    UsuarioInputDto:
      type: object
      properties:
        nombre:
          type: string
        correo:
          type: string
    UsuarioOutputDto:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        correo:
          type: string
    DoctorInputDto:
      type: object
      properties:
        profesion:
          type: string
        usuarioId:
          type: string
          format: uuid
    DoctorOutputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        profesion:
          type: string
        usuarioId:
          type: string
          format: uuid
    PrubeaInputDto:
      type: object
      properties:
        h:
          type: string
        sgsg:
          type: string
        usuarioId:
          type: string
          format: uuid
    PrubeaOutputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        h:
          type: string
        sgsg:
          type: string
        usuarioId:
          type: string
          format: uuid
    ProductoInputDto:
      type: object
      properties:
        precio:
          type: number
          format: double
        usuarioId:
          type: string
          format: uuid
    ProductoOutputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        precio:
          type: number
          format: double
        usuarioId:
          type: string
          format: uuid
