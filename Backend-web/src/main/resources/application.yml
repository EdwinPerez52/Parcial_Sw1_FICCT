spring:
  application:
    name: collab-modeler-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/modeler}
    username: ${DATABASE_USER:modeler}
    password: ${DATABASE_PASSWORD:modeler}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp:
      auth: ${MAIL_AUTH:false}
      starttls.enable: ${MAIL_STARTTLS:false}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  mobile-spec:
    secret: ${MOBILE_SPEC_SECRET:modeler-mobile-spec-secret-signing-key-32b}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  auth:
    verification-minutes: ${AUTH_VERIFICATION_MINUTES:60}
    reset-minutes: ${AUTH_RESET_MINUTES:30}
    invitation-hours: ${AUTH_INVITATION_HOURS:72}
  collaboration:
    redis-enabled: ${COLLABORATION_REDIS_ENABLED:true}
    presence-ttl-seconds: ${PRESENCE_TTL_SECONDS:45}
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:openai}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    text-model: ${AI_TEXT_MODEL:gpt-4.1-mini}
    vision-model: ${AI_VISION_MODEL:gpt-4.1-mini}
    audio-model: ${AI_AUDIO_MODEL:gpt-4o-mini-transcribe}
    proposal-minutes: ${AI_PROPOSAL_MINUTES:15}
    max-instruction-length: ${AI_MAX_INSTRUCTION_LENGTH:2000}
  generation:
    local-storage-path: ${GENERATION_LOCAL_STORAGE_PATH:./var/artifacts}
    encryption-key: ${GENERATION_ENCRYPTION_KEY:local-generation-key-change-me}
    download-secret: ${GENERATION_DOWNLOAD_SECRET:local-download-secret-change-me}
    download-url-minutes: ${GENERATION_DOWNLOAD_URL_MINUTES:5}
    retention-hours: ${GENERATION_RETENTION_HOURS:168}
